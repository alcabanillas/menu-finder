schema: spec-driven

# Derived from PROC-sdd (context/decisiones.md §1.9).
# If PROC-sdd changes, this file changes; not the other way round.

context: |
  Master's thesis (AI Development): natural-language search over 36 weekly menus
  from a nutritionist, with the shopping list as a checklist.
  Reading map: AGENTS.md. Normative reference: context/decisiones.md; scope in context/producto.md.
  Stack: Next.js 16 (App Router) + TypeScript, Tailwind CSS v4, pnpm, Neon
  (PostgreSQL + pgvector), Gemini via Genkit, Vercel, Sentry.
  Hexagonal architecture with two primary adapters (app/ and cli/); dependency
  rules in context/adr/ADR-001-arquitectura-interna.md, enforced by ESLint.
  Mandatory security: context/safety-first.md.
  Nutritionist data only in data/ (gitignored): never in the repo, in real
  fixtures, in logs or in Sentry (SEG-datos-nutricionista).
  Language: English. All artifacts, code and identifiers in English.
  Project documentation (context/, README) is in Spanish; when citing it, keep decision codes and paths as they are.

rules:
  proposal:
    - State the ID of the context/roadmap.md item the change implements (e.g. MF-14). The change name starts with that ID in lowercase (mf-14-spike-buscador).
    - Identify the data the change touches, the possible abuses and the OWASP categories that apply (safety-first P1, SEG-owasp).
    - Cite by code the context/decisiones.md decisions it relies on (e.g. BUS-descomponedor). If the change contradicts one, say so in the proposal; don't resolve it silently.
  specs:
    - Every endpoint or CLI command comes with its negative authorization and input-validation scenarios, besides the positive ones.
    - Every scenario must be verifiable with an automated test.
  design:
    - Follow ADR-001 - a port only where there is a real external boundary; pure logic in domain; thin adapters.
    - UI goes in features/ following the Scope Rule (ADR-001 §2) - local to its feature until a second one uses it; then it moves up to shared/ui/. Features receive data and actions through props; only app/ touches the web-container.
  tasks:
    - Include the test tasks for every spec scenario, negative ones included.
    - TDD (PROC-tdd) - the test task for each scenario comes before its implementation task, and the test is seen failing before the code is written.

operations:
  archive:
    guidance:
      - Before archiving, go through the checklist in context/safety-first.md §4 and record the result.
