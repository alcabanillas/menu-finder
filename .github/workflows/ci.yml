name: CI

on:
  push:
    branches: [main]
  pull_request:

# safety-first §2.4: least-privilege permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # safety-first §2.5: never resolves new versions.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests run against a Neon branch made only for CI (never production). Direct (unpooled) URL; without
      # the secret (forks, no access) they are skipped.
      - run: pnpm test:coverage
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

      # The web container needs these to start (MF-20.3). A throwaway secret per run, never a real one; the database URL
      # points nowhere: the end-to-end tests that run here never reach the database (no cookie, or a forged one).
      - name: Set throwaway authentication variables
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          {
            echo "BETTER_AUTH_SECRET=$secret"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "DATABASE_URL=postgresql://ci:ci@unreachable.invalid:5432/none"
          } >> "$GITHUB_ENV"

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
