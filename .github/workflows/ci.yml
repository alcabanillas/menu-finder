name: CI

on:
  push:
    branches: [main]
    # A version tag is a release: the whole suite runs again on it and, if green, `deploy` publishes it (MF-26 D4).
    tags: ['v*']
  pull_request:

# safety-first §2.4: least-privilege permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # safety-first §2.5: never resolves new versions.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests run against a Neon branch made only for CI (never production). Direct (unpooled) URL; without
      # the secret (forks, no access) they are skipped.
      - run: pnpm test:coverage
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

  # In parallel with `checks`: it does not depend on it, so the run lasts as long as the slower of the two (MF-50).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web container and the CLI need these (MF-20.3). A throwaway secret per run, never a real one. The database is
      # the Neon `ci` branch; where the secret is missing (forks) the URL points nowhere and the sign-in end-to-end
      # tests are skipped: the rest never reach the database (no cookie, or a forged one).
      - name: Set authentication and database variables
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          {
            echo "BETTER_AUTH_SECRET=$secret"
            echo "DATABASE_URL_TEST=$DATABASE_URL_TEST"
          } >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # test → build → deploy (OPS-ci-cd): only for a version tag whose commit is already in `main`, and only after both
  # test jobs pass on that commit. Merging into `main` never deploys (MF-26 design D3, D4).
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never cancelled halfway, unlike the test runs.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The CLI reads the token from the environment, so it never shows on a command line.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Full history: the tagged commit is compared with `main` below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The Vercel CLI is a pinned devDependency: it comes from the lockfile (MF-26 design D3).
      - run: pnpm install --frozen-lockfile

      - name: Check that the tagged commit is in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # package.json is the source of the version the app shows; a tag that does not match it never deploys (MF-26 D6).
      - name: Check that the tag matches the version in package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - run: pnpm exec vercel deploy --prebuilt --prod -m "version=$GITHUB_REF_NAME"
