name: CI

on:
  push:
    # production: the branch Vercel deploys. The whole suite runs again on the commit it is moved to, and Vercel's
    # Deployment Checks hold the deployment until checks, e2e and release pass (MF-26 design D3, D4).
    branches: [main, production]
  pull_request:

# safety-first §2.4: least-privilege permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # safety-first §2.5: never resolves new versions.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests run against a Neon branch made only for CI (never production). Direct (unpooled) URL; without
      # the secret (forks, no access) they are skipped.
      - run: pnpm test:coverage
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

  # In parallel with `checks`: it does not depend on it, so the run lasts as long as the slower of the two (MF-50).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web container and the CLI need these (MF-20.3). A throwaway secret per run, never a real one. The database is
      # the Neon `ci` branch; where the secret is missing (forks) the URL points nowhere and the sign-in end-to-end
      # tests are skipped: the rest never reach the database (no cookie, or a forged one).
      - name: Set authentication and database variables
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          {
            echo "BETTER_AUTH_SECRET=$secret"
            echo "DATABASE_URL_TEST=$DATABASE_URL_TEST"
          } >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # A release is a commit of main tagged v<version of package.json>; anything else never reaches production
  # (MF-26 design D4, D6). Its result is one of the Deployment Checks in Vercel.
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the commit is compared with main and with its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the commit is in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check that the commit is tagged with the version in package.json
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::The commit is not tagged $tag, the version in package.json"
            exit 1
          fi
