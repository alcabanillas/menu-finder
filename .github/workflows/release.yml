name: Release

# A release is a commit of main tagged v<version of package.json>; anything else never reaches production
# (MF-26 design D4, D6). Its result is one of the Deployment Checks in Vercel. It lives apart from ci.yml so the
# commit has a single `release` run: in ci.yml the push to main left a skipped `release` on the same commit, and
# Vercel matches checks by commit and job name.
on:
  push:
    branches: [production]

# safety-first §2.4: least-privilege permissions.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the commit is compared with main and with its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the commit is in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check that the commit is tagged with the version in package.json
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::The commit is not tagged $tag, the version in package.json"
            exit 1
          fi
