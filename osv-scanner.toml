# Accepted vulnerabilities (MF-41, openspec/changes/archive/2026-10-03-mf-41-search-index/proposal.md).
# All four come through genkit@1.42.0, which pins @opentelemetry/core ~1.25, @opentelemetry/sdk-node ^0.52
# and uuid ^10. The patched versions are new majors: forcing them with pnpm overrides makes genkit fail to
# load (`core_1.getEnv is not a function`), checked on 2026-10-01. None is reachable as the project uses
# genkit today. Review again in MF-40 and MF-22, when genkit runs in the decomposer and on Vercel.
# Dependabot does not read this file: the same four alerts are dismissed in GitHub with the reason
# "Vulnerable code is not actually used".

[[IgnoredVulns]]
id = "GHSA-q7rr-3cgh-j5r3"
reason = "Prometheus exporter crash (@opentelemetry/sdk-node, auto-instrumentations-node). Needs the Prometheus exporter listening; genkit never configures it and the project must never enable it (OTEL_METRICS_EXPORTER=prometheus)."

[[IgnoredVulns]]
id = "GHSA-45rx-2jwx-cxfr"
reason = "JaegerPropagator DoS on a malformed header (@opentelemetry/propagator-jaeger). Only active when 'jaeger' is in the configured propagators; the default is tracecontext,baggage and the project never adds jaeger."

[[IgnoredVulns]]
id = "GHSA-8988-4f7v-96qf"
reason = "Unbounded memory in W3C Baggage propagation (@opentelemetry/core). Needs incoming HTTP requests whose baggage header OpenTelemetry extracts; the CLI receives none and genkit adds no HTTP instrumentation. Review in MF-22, when genkit runs behind HTTP on Vercel."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
reason = "uuid v3/v5/v6 bounds check when a buf argument is passed. The only call found in the installed genkit chain is gaxios `v4()` without arguments (checked 2026-10-01); the project does not use uuid."

# Accepted 2026-10-07, same cause as the four above: @genkit-ai/google-cloud@1.42.0 pins
# @opentelemetry/auto-instrumentations-node ^0.49.1, and the fix needs instrumentation-pg >=0.73.0 and the
# other instrumentation-* packages at matching versions. Review with the four above.
[[IgnoredVulns]]
id = "GHSA-qqmp-wf37-98f9"
reason = "instrumentation-* (pg, mysql, knex...) put the database user in the db.user span attribute. The instrumentations only load when genkit telemetry is enabled (enableGoogleCloudTelemetry, enableFirebaseTelemetry or ENABLE_FIREBASE_MONITORING=true); the project enables none of them. It uses pg, so enabling genkit telemetry would send the Neon role name to the trace exporter."

# Accepted 2026-10-03. braces has no patched version. It comes only through development tools:
# micromatch, used by eslint-plugin-boundaries and by eslint-config-next (via fast-glob).
# Remove this entry when braces publishes a fix.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces stack exhaustion on deeply nested brace patterns. Only development tools use it (ESLint plugins, through micromatch), and the patterns they expand come from the project's own lint configuration, never from user input. Nothing in the production build uses it."

# Accepted 2026-10-09. handlebars has 3 vulnerabilities in 4.7.9. It comes only through
# eslint-plugin-boundaries@7.2.0 (dev tool, internal error formatting) and genkit@1.42.0 via dotprompt@1.1.2.
# The project uses genkit only for embeddings (gemini-embedding-2) and does not compile prompt templates
# with dotprompt. Neither source exposes Handlebars template compilation to user input in production.
[[IgnoredVulns]]
id = "GHSA-8r5x-fm3f-whwj"
reason = "Prototype pollution via helper resolution in handlebars. Only pulled by dev tools (eslint-plugin-boundaries) and genkit's dotprompt. The project does not compile untrusted templates or use dotprompt."

[[IgnoredVulns]]
id = "GHSA-p8wg-vrv2-v86f"
reason = "Arbitrary code execution via lookup helper in handlebars. Same as GHSA-8r5x-fm3f-whwj: never exposed to untrusted templates in production."

[[IgnoredVulns]]
id = "GHSA-xw65-4hp5-5hc7"
reason = "JavaScript injection via inline precompiled templates in handlebars. Same as GHSA-8r5x-fm3f-whwj: the project does not compile or embed precompiled templates from untrusted input."

